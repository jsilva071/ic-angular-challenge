<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="app-header">
  <div class="app-header__inner">
    <a routerLink="/products" class="app-header__brand">
      <span aria-hidden="true">🛍️</span>
      Product Catalog
    </a>

    <nav class="app-nav" aria-label="Primary">
      <a
        routerLink="/products"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Catalog</a
      >
      <a routerLink="/products/new" routerLinkActive="is-active" class="app-nav__cta"
        >+ Add product</a
      >
    </nav>
  </div>
</header>

<main id="main-content" class="app-main" tabindex="-1">
  <router-outlet />
</main>

<footer class="app-footer">
  <p>
    Data from the
    <a href="https://fakestoreapi.com/" target="_blank" rel="noopener noreferrer">Fake Store API</a
    >. Built for a coding challenge.
  </p>
</footer>
